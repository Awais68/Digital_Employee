mily="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">(like Forbes, TechCrunch, HBR</text><text x="80" y="932.4000000000001" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">covers) - Dark background with</text><text x="80" y="970.1" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">vibrant accent colors (deep</text><text x="80" y="1007.8000000000001" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">blue + orange/gold or purple +</text><text x="80" y="1045.5" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">cyan) - Clean typography</text><text x="80" y="1083.2" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">overlay with the key hook</text><text x="80" y="1120.9" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">message - Abstract</text><text x="80" y="1158.6" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">tech/graph/data visualization</text><text x="80" y="1196.3000000000002" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">elements - NO human faces - NO</text><text x="80" y="1234" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">text that says &quot;AI generated&quot;</text><text x="80" y="1271.7" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">- 1080x1350 vertical format</text><text x="80" y="1309.4" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">(LinkedIn/Instagram feed) -</text><text x="80" y="1347.1" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">Resolution: sharp, production</text><text x="80" y="1384.8000000000002" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">quality Style keywords:</text><text x="80" y="1422.5" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">modern, premium, editorial,</text><text x="80" y="1460.2" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">tech, data visualization, dark</text><text x="80" y="1497.9" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5">mode, professional, minimalist</text>
