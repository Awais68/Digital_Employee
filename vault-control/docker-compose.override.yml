# Local development overrides
# Run: docker compose -f docker-compose.prod.yml -f docker-compose.override.yml up -d
services:
  backend:
    environment:
      - NODE_ENV=development
      - ENABLE_AUTH=false
    volumes:
      - ./server:/app/server
      - ./node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229" # debugger

  frontend:
    build:
      args:
        - VITE_ENABLE_AUTH=false
    ports:
      - "80:80"
      - "5173:5173" # Vite dev server

  orchestrator:
    environment:
      - DRY_RUN=true
    profiles:
      - debug
