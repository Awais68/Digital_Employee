services:
  postgres:
    image: postgres:16-alpine
    container_name: vault-control-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_control_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vault-control-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - VAULT_PATH=/vault
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=vault_control
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-vault_control_password_change_me}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRY=24h
      - NODE_ENV=production
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
    ports:
      - "3000:3000"
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vault-control-ui
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_ENABLE_AUTH=${VITE_ENABLE_AUTH:-false}
    ports:
      - "80:80"

volumes:
  postgres_data:
