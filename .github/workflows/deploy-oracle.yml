name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
    paths:
      - 'vault-control/server/**'
      - 'vault-control/src/**'
      - 'vault-control/package.json'
      - 'vault-control/package-lock.json'
      - '*.py'
      - '*.js'
      - 'mcp_servers/**'
      - 'Agent_Skills/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-oracle.yml'
  workflow_dispatch:

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vault-control/package-lock.json

      - name: Install dependencies
        working-directory: vault-control
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci --no-audit --no-fund

      - name: Syntax-check server JS
        working-directory: vault-control
        run: |
          for f in $(find server -name "*.js"); do
            node --check "$f" || exit 1
          done
          echo "✅ All server JS files OK"

      - name: Syntax-check core Python workers
        run: |
          python3 -m py_compile \
            gmail_watcher.py \
            orchestrator.py \
            workers.py \
            audit_log.py \
            llm_router.py \
            universal_tool_executor.py \
            publish_post.py \
            ralph_wiggum.py
          echo "✅ Python workers OK"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pack tarball
        run: |
          # Collect root-level py/js files safely
          PY_FILES=$(ls *.py 2>/dev/null | tr '\n' ' ')
          JS_FILES=$(ls *.js 2>/dev/null | tr '\n' ' ')

          tar -czf /tmp/deploy.tar.gz \
            --exclude='vault-control/node_modules' \
            --exclude='vault-control/.env' \
            --exclude='vault-control/dist' \
            --exclude='node_modules' \
            --exclude='.git' \
            vault-control/server \
            vault-control/package.json \
            vault-control/package-lock.json \
            mcp_servers \
            Agent_Skills \
            requirements.txt \
            remote_deploy.sh \
            $PY_FILES $JS_FILES

          du -h /tmp/deploy.tar.gz

      - name: Upload to Oracle VM
        run: |
          scp -i ~/.ssh/oracle_key /tmp/deploy.tar.gz \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/oracle_key \
            ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "tar -xzf /tmp/deploy.tar.gz -C ~/Digital_Employee && \
             chmod +x ~/Digital_Employee/remote_deploy.sh && \
             ~/Digital_Employee/remote_deploy.sh"

      - name: Health check
        run: |
          sleep 8
          curl -sfk -m 15 https://digitalfte.online/api/health \
            && echo "✅ Health check passed" \
            || echo "⚠️ Health check failed — check server logs"
